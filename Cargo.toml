[package]
name = "moss-and-mere"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A quiet fantasy world to wander, built with wgame"

[features]
default = ["desktop"]
desktop = ["wgame/desktop", "dep:sdl2"]
web = ["wgame/web", "dep:web-sys"]

[dependencies]
wgame = { path = "../wgame/wgame", default-features = false, features = ["shapes", "image", "typography"] }
web-sys = { version = "0.3.105", optional = true, features = ["Window", "Storage", "AudioContext", "AudioContextState", "AudioDestinationNode", "AudioBuffer", "AudioBufferSourceNode", "AudioNode", "AudioParam", "GainNode"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sdl2 = { version = "0.34.5", optional = true }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
